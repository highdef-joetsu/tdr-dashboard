name: collect
description: コレクタを実行し、他ワークフローと衝突しない形でデータをコミットする
inputs:
  collector:
    description: collectors 配下のモジュール名（複数はスペース区切り。左から順に実行）
    required: true
  browser:
    description: "true なら Playwright の Chromium を入れて xvfb 配下で実行する"
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip

    - name: 依存をインストール
      shell: bash
      run: pip install -r requirements.txt

    - name: Chromium をインストール
      if: inputs.browser == 'true'
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq xvfb
        python -m playwright install --with-deps chromium

    - name: コレクタを実行
      shell: bash
      # 公式サイトは headless Chromium を無応答でドロップするため headed + xvfb で動かす。
      # TDR_WRITE_MANIFEST に「このジョブが書いたファイル」が溜まる。
      run: |
        set -e
        export TDR_WRITE_MANIFEST="${RUNNER_TEMP}/written.txt"
        : > "$TDR_WRITE_MANIFEST"
        for m in ${{ inputs.collector }}; do
          echo "::group::$m"
          if [ "${{ inputs.browser }}" = "true" ]; then
            xvfb-run -a --server-args="-screen 0 1280x1024x24" python -m collectors."$m"
          else
            python -m collectors."$m"
          fi
          echo "::endgroup::"
        done
        sort -u "$TDR_WRITE_MANIFEST" -o "$TDR_WRITE_MANIFEST"
        echo "このジョブが書いたファイル:"; cat "$TDR_WRITE_MANIFEST"

    - name: データをコミット
      shell: bash
      env:
        TZ: Asia/Tokyo
      # 生成物は毎回中身が変わるので rebase は必ず衝突する。
      # 代わりに「最新の origin/main に reset → 自分が書いたファイルだけ置き直す
      # → latest.json を作り直す」を push が通るまで繰り返す。
      # 自分が書いたファイルは他コレクタのものと重ならない（health もコレクタ別）。
      run: |
        set -e
        MANIFEST="${RUNNER_TEMP}/written.txt"
        SNAP="${RUNNER_TEMP}/snapshot"
        rm -rf "$SNAP"; mkdir -p "$SNAP"
        # --ignore-times: rsync の既定はサイズ＋mtime での高速判定だが、
        # 生成JSONは時刻の桁数が同じでサイズが変わらず、git reset と書き込みが
        # 同一秒に入ると「変更なし」と誤判定されて復元が黙ってスキップされる
        # （実測: 混雑カレンダーの取得結果が3回連続でコミットされていなかった）。
        rsync -a --ignore-times --files-from="$MANIFEST" . "$SNAP"/

        git config user.name  "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        for i in 1 2 3 4 5; do
          git fetch -q origin "${GITHUB_REF_NAME}"
          git reset -q --hard "origin/${GITHUB_REF_NAME}"
          rsync -a --ignore-times "$SNAP"/ .

          # 復元されたことを実際に突き合わせる。落ちたことに気づけない状態を作らない。
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            if ! cmp -s "$SNAP/$f" "$f"; then
              echo "復元に失敗した: $f" >&2
              exit 1
            fi
          done < "$MANIFEST"

          python -m collectors.build_latest

          git add -A docs/data
          if git diff --cached --quiet; then
            echo "変更なし。コミットしない。"
            exit 0
          fi
          git commit -q -m "data: ${{ inputs.collector }} $(date '+%Y-%m-%d %H:%M') JST"
          if git push -q origin "HEAD:${GITHUB_REF_NAME}"; then
            echo "push 成功 (試行 $i)"
            exit 0
          fi
          echo "push 失敗 (試行 $i)。他のワークフローが先に書いた。作り直して再試行する。"
          sleep $((i * 5))
        done
        echo "push に5回失敗した。" >&2
        exit 1
