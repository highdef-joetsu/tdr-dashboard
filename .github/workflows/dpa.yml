name: DPA販売状況 (手動・予備)

on:
  # スケジュールは止めてある。取得は Cloudflare Worker が担当する
  # （GitHub の cron は高頻度スケジュールの大半を実行しない。
  #  実測 2026-09-03: 期待168本に対し発火1本・87分遅れ）。
  # 日次ファイルは ingest.yml が Worker の生サンプルから毎回組み直すため、
  # ここを手動実行しても次の取り込みで上書きされる。緊急時の確認用。
  workflow_dispatch:

permissions:
  contents: write

# ワークフローごとに別グループにする。
# 全部を同じグループにすると、GitHub はグループあたり待機ジョブを1本しか保持せず
# 古い待機ジョブを黙ってキャンセルするため、5分間隔のDPAが取りこぼされる。
concurrency:
  group: data-dpa
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/collect
        with:
          collector: "dpa"
          browser: "false"
