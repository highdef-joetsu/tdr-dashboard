name: 取り込み (Workerからの通知)

on:
  # Cloudflare Worker が20分ごとに repository_dispatch を投げる。
  # cron ではなくイベントなので、GitHub の schedule のような取りこぼしが起きない。
  repository_dispatch:
    types: [ingest]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-ingest
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TDR_WORKER_URL: ${{ secrets.TDR_WORKER_URL }}
      TDR_INGEST_TOKEN: ${{ secrets.TDR_INGEST_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/collect
        with:
          collector: "ingest waitcurve estimates"
