name: 公式サイト (JST 6:00/12:00)

on:
  schedule:
    - cron: "37 21,3 * * *"
  workflow_dispatch:

permissions:
  contents: write

# ワークフローごとに別グループにする。
# 全部を同じグループにすると、GitHub はグループあたり待機ジョブを1本しか保持せず
# 古い待機ジョブを黙ってキャンセルするため、5分間隔のDPAが取りこぼされる。
concurrency:
  group: data-official
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/collect
        with:
          collector: "official estimates"
          browser: "true"
